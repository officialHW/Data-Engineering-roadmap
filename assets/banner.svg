<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Data Engineering Roadmap. Learn the basics. Build real projects. Document the journey." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="round"><rect width="1280" height="320" rx="14"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="14" fill="#0B1220"/>
  <rect width="1280" height="320" rx="14" fill="url(#grid)"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="132" font-size="56" font-weight="700" fill="#F5F7FA">Data Engineering</text>
    <text x="72" y="196" font-size="56" font-weight="700" fill="#2DD4BF">Roadmap</text>
    <text x="72" y="246" font-size="20" fill="#94A3B8">Learn the basics. Build real projects. Document the journey.</text>
  </g>

  <g stroke="#2DD4BF" stroke-width="2" fill="none">
    <line x1="816" y1="150" x2="894" y2="150" stroke-opacity="0.55"/>
    <line x1="926" y1="150" x2="1004" y2="150" stroke-opacity="0.55"/>
    <line x1="1036" y1="150" x2="1114" y2="150" stroke-opacity="0.55"/>
    <circle cx="800" cy="150" r="16" fill="#0B1220"/>
    <circle cx="910" cy="150" r="16" fill="#0B1220"/>
    <circle cx="1020" cy="150" r="16" fill="#0B1220"/>
    <circle cx="1130" cy="150" r="16" fill="#2DD4BF"/>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle" letter-spacing="1.2">
    <text x="800" y="196">INGEST</text>
    <text x="910" y="196">TRANSFORM</text>
    <text x="1020" y="196">STORE</text>
    <text x="1130" y="196">SERVE</text>
  </g>

  <rect x="0" y="316" width="1280" height="4" fill="#2DD4BF" clip-path="url(#round)"/>
</svg>
